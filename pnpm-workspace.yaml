packages:
  - apps/*
  - packages/*
allowBuilds:
  # core-js only prints a funding banner from its postinstall script; its
  # runtime modules are already shipped in the package, so no build is needed.
  core-js: false
  # Electron's postinstall downloads the runtime binary for this platform.
  electron: true
  # Squirrel.Windows is not a target of the desktop build; its native helper
  # never needs to be fetched.
  electron-winstaller: false
  # esbuild bundles the desktop main process.
  esbuild: true
minimumReleaseAgeExclude:
  - vite@8.2.1
  - svg2pdf.js@2.8.0
  - electron@44.4.2
