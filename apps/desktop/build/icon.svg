      <stop offset="0" stop-color="#2a3a5a"/>
      <stop offset="1" stop-color="#1b2740"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sheet)"/>
  <g fill="none" stroke="#f2efe6" stroke-width="34" stroke-linecap="round" stroke-linejoin="round">
    <path d="M176 118v276l222-138z"/>
    <path d="M66 186h110M66 326h110M398 256h42"/>
  </g>
  <g class="icon-detail" fill="none" stroke="#f2efe6" stroke-width="18" stroke-linecap="round">
    <path d="M206 186h32"/>
