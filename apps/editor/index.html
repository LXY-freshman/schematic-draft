<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e3d36" />
    <!-- The window and executable icons come from `apps/desktop/build/icon.ico`.
         This favicon only shows when the same bundle is opened in a browser
         during development. -->
    <link rel="icon" href="%BASE_URL%schematic-draft-mark.svg" />
    <title>Schematic Draft</title>
    <script>
      if (
        localStorage.theme === "light" ||
        (!localStorage.theme &&
          matchMedia("(prefers-color-scheme: light)").matches)
      ) {
        document.documentElement.classList.add("light");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
